<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Calculadora de IMC</a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link" href="/">Calculadora</a></li>
                <li class="nav-item"><a class="nav-link" href="/equipe">Equipe</a></li>
            </ul>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4">Calculadora de IMC</h1>

        <div class="card">
            <div class="card-header">Informe seus dados</div>
            <div class="card-body">
                <form method="post" action="/">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="peso" class="form-label">Peso (kg)</label>
                        <input type="number" class="form-control" id="peso" name="peso" step="0.01" min="1" max="300"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="altura" class="form-label">Altura (m)</label>
                        <input type="number" class="form-control" id="altura" name="altura" step="0.01" min="0.5"
                            max="2.5" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Calcular IMC</button>
                </form>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">Resultado</div>
            <div class="card-body">
                <div class="alert alert-success mb-0" role="alert">
                    <h4 class="alert-heading">Nome da pessoa</h4>
                    <p class="mb-1">Seu IMC é <strong>00,00</strong></p>
                    <p class="mb-0">Faixa: <strong>Nome da faixa</strong></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
