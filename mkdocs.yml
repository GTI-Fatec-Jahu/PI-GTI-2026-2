site_name: Programação para Internet — ILP951
site_description: Material da disciplina Programação para Internet (Fatec Jahu, 2º Semestre/2026)
site_author: Ronan Adriel Zenatti

docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs_quiz

# O nav é EXPLÍCITO (ver CLAUDE.md): um arquivo novo em docs/ não aparece sozinho no site.
# O conteúdo anterior foi arquivado em old/ (fora de docs_dir, não é publicado); o nav
# anterior está em old/mkdocs.yml. As entradas novas entram aqui conforme a nova sequência.
nav:
  - Início: index.md
  - Projeto 1 — Catálogo de Produtos:
      - "Capítulo 1 — Git, GitHub, HTML5 e CSS": capitulos/Capitulo_01_Git_GitHub_HTML5_e_CSS.md
      - "Capítulo 2 — Clone, pull, formulário, CSS e JavaScript": capitulos/Capitulo_02_Clone_Pull_Formulario_CSS_e_JS.md
      - "Capítulo 2.1 — Python essencial (opcional)": capitulos/Capitulo_02_1_Python_Essencial.md
      - "Capítulo 3 — Flask": capitulos/Capitulo_03_Flask.md
      - "Capítulo 4 — Bootstrap com Flask": capitulos/Capitulo_04_Bootstrap_com_Flask.md
      - "Capítulo 5 — Variáveis, filtros, if e for": capitulos/Capitulo_05_Variaveis_Filtros_If_e_For.md
      - "Capítulo 6 — Herança de templates, include e páginas de erro": capitulos/Capitulo_06_Heranca_Include_e_Paginas_de_Erro.md
      - "Capítulo 7 — Formulários": capitulos/Capitulo_07_Formularios.md
      - "Capítulo 8 — Session": capitulos/Capitulo_08_Session.md
      - "Capítulo 9 — Validação e flash": capitulos/Capitulo_09_Validacao_e_Flash.md
      - "Capítulo 10 — Banco de dados": capitulos/Capitulo_10_Banco_de_Dados.md
  - Projeto 2 — Sistema de Gestão:
      - "Capítulo 11 — Projeto novo e banco": capitulos/Capitulo_11_Projeto_Novo_e_Banco.md
      - "Capítulo 12 — INSERT e SELECT de perfis": capitulos/Capitulo_12_INSERT_e_SELECT_de_Perfis.md
      - "Capítulo 12.1 — Busca, filtro e paginação (opcional)": capitulos/Capitulo_12_1_Busca_Filtro_e_Paginacao.md
      - "Capítulo 13 — UPDATE e DELETE de perfis": capitulos/Capitulo_13_UPDATE_e_DELETE_de_Perfis.md
